name: Tests

# Runs the Vitest suite (tests/) on every push and pull request. It covers
# @lift/core, the pure logic under mobile/src, and the web storage adapters;
# the UI and the Worker have no automated tests (see CLAUDE.md).

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Rust and binding generator
        run: |
          rustup show
          cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - name: Build and test actual WebAssembly
        run: |
          npm run engine:wasm
          node scripts/engine/wasm-smoke.mjs
          npm run engine:integration
      - name: Check generated Rust contracts
        run: |
          cargo run -p lift-domain --features typescript --bin lift-typescript -- packages/engine-client/src/generated
          git diff --exit-code -- packages/engine-client/src/generated
      - name: Check client types
        run: npm --workspace @lift/engine-client run typecheck

  swift-bindings:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Test generated Swift bindings against Rust
        run: node scripts/engine/swift-smoke.mjs

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all --check
      - name: Test compatibility rules
        run: cargo test --workspace --locked
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check browser portability
        run: cargo check -p lift-domain -p lift-codec -p lift-engine -p lift-wasm --locked --target wasm32-unknown-unknown

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      # The workspaces install together from the root lockfile, the same way
      # the build workflows do. --ignore-scripts skips native postinstall steps
      # (Expo, esbuild prompts) the tests do not need.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test
