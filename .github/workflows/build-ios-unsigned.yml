name: Build iOS (unsigned IPA)

# Builds an unsigned arm64 .ipa on a GitHub-hosted macOS runner. The artifact
# is meant to be fed to Sideloadly (or similar), which re-signs it with a free
# Apple ID before installing on your iPhone. No paid Apple Developer account
# required.

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Xcode configuration"
        type: choice
        default: Release
        options:
          - Release
          - Debug

      force_rebuild:
        description: "Compile even when an identical app artifact is cached"
        type: boolean
        default: false
      runner:
        description: "Runner label (optionally use your faster/self-hosted runner)"
        type: string
        default: macos-26

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.configuration }}-device
  cancel-in-progress: true

jobs:
  build:
    # macos-15 tops out at Xcode 16.4, which ships Swift 6.1. Since the Expo
    # 57 upgrade a native dependency needs Swift tools 6.2, so the build fails
    # there at package resolution. macos-26 carries Xcode 26.x, which has it.
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    env:
      CI: "1"
      LIFT_IOS_TARGETS: aarch64-apple-ios
      USE_CCACHE: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Newest available rather than a pinned major: a pin is what broke this
      # build when a dependency started requiring a newer Swift toolchain.
      # The list is printed so a future toolchain failure names its own cause.
      - name: Select newest Xcode
        id: xcode
        run: |
          ls /Applications | grep -E '^Xcode' || true
          XCODE=$(ls /Applications | grep -E '^Xcode_[0-9]' | sort -V | tail -n 1)
          if [ -z "$XCODE" ]; then echo "No versioned Xcode found"; exit 1; fi
          sudo xcode-select -s "/Applications/$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version
          echo "version=$(xcodebuild -version | tr ' \n' '-')" >> "$GITHUB_OUTPUT"

      - name: Fingerprint app inputs
        id: inputs
        working-directory: .
        env:
          BUILD_PLATFORM: ios
          BUILD_CONFIGURATION: ${{ inputs.configuration }}
          BUILD_ARCHITECTURES: aarch64-apple-ios
          BUILD_TOOLCHAIN: ${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}
        run: node scripts/ci/mobile-fingerprint.mjs

      - name: Reuse identical app artifact
        id: app-cache
        if: ${{ !inputs.force_rebuild }}
        uses: actions/cache@v6
        with:
          path: target/mobile-artifacts/ios
          key: mobile-app-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.fingerprint }}

      - name: Setup Node
        if: steps.app-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install mobile workspace dependencies
        if: steps.app-cache.outputs.cache-hit != 'true'
        run: npm ci --workspace lift-mobile --include-workspace-root=false --no-fund
        working-directory: .

      - name: Install Rust toolchain and targets
        if: steps.app-cache.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          rustup show
          rustup target add aarch64-apple-ios

      - name: Cache Rust compilation
        if: steps.app-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: ios-device
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Prepare Rust native module
        if: steps.app-cache.outputs.cache-hit != 'true'
        working-directory: .
        run: node scripts/engine/prepare-native.mjs ios

      - name: Expo prebuild (generate ios/)
        if: steps.app-cache.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install compiler cache
        if: steps.app-cache.outputs.cache-hit != 'true'
        run: command -v ccache || brew install ccache

      - name: Cache CocoaPods and Xcode compilation
        if: steps.app-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/CocoaPods
            mobile/ios/Pods
            mobile/build/Build
            mobile/build/ModuleCache.noindex
            .ccache
          key: ios-native-v1-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ inputs.configuration }}-${{ hashFiles('package-lock.json', 'mobile/**/*.podspec') }}-${{ github.sha }}
          restore-keys: |
            ios-native-v1-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ inputs.configuration }}-${{ hashFiles('package-lock.json', 'mobile/**/*.podspec') }}-

      - name: Install CocoaPods
        if: steps.app-cache.outputs.cache-hit != 'true'
        run: pod install
        working-directory: mobile/ios

      - name: Resolve Xcode scheme from app.json
        if: steps.app-cache.outputs.cache-hit != 'true'
        id: scheme
        run: |
          SCHEME=$(node -e "console.log(require('./app.json').expo.name)")
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using scheme: $SCHEME"
          xcodebuild -workspace ios/*.xcworkspace -list 2>&1 | sed -n '/Schemes:/,/^$/p' || true

      - name: Build .app (unsigned)
        if: steps.app-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/*.xcworkspace \
            -scheme "${{ steps.scheme.outputs.scheme }}" \
            -configuration "${{ inputs.configuration }}" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            -showBuildTimingSummary \
            build

      - name: Package unsigned .ipa
        if: steps.app-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BUILD_ROOT="$GITHUB_WORKSPACE/mobile/build"
          echo "Searching under: $BUILD_ROOT"
          if [ ! -d "$BUILD_ROOT" ]; then
            echo "Build root missing. mobile/ contents:"
            ls -la "$GITHUB_WORKSPACE/mobile" || true
            exit 1
          fi
          APP_PATH=$(find "$BUILD_ROOT" -type d -name "*.app" -path "*${{ inputs.configuration }}-iphoneos*" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app produced. Tree under build/:"
            find "$BUILD_ROOT" -maxdepth 5 -type d | head -50
            exit 1
          fi
          echo "App at: $APP_PATH"
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/Payload"
          cp -R "$APP_PATH" "$STAGE/Payload/"
          VERSION=$(node -e "console.log(require('$GITHUB_WORKSPACE/mobile/app.json').expo.version)")
          mkdir -p "$GITHUB_WORKSPACE/target/mobile-artifacts/ios"
          OUT="$GITHUB_WORKSPACE/target/mobile-artifacts/ios/lift-${VERSION}-unsigned.ipa"
          (cd "$STAGE" && zip -qr "$OUT" Payload)
          ls -lh "$OUT"
          echo "IPA_PATH=$OUT" >> "$GITHUB_ENV"

      - name: Verify app artifact
        working-directory: .
        env:
          BUILD_PLATFORM: ios
        run: python3 scripts/ci/verify-mobile-artifact.py

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: lift-unsigned-ipa
          path: target/mobile-artifacts/ios/*.ipa
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Build summary
        env:
          CACHE_HIT: ${{ steps.app-cache.outputs.cache-hit }}
          FINGERPRINT: ${{ steps.inputs.outputs.fingerprint }}
        run: |
          echo "App fingerprint: $FINGERPRINT" >> "$GITHUB_STEP_SUMMARY"
          echo "Reused identical app: ${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
